<ul class="social {{ extra_class }}" aria-label="Social media">
  {% if site.youtube_url %}<li><a href="{{ site.youtube_url }}" target="_blank" rel="noopener" aria-label="YouTube"><svg class="icon" aria-hidden="true"><use href="#i-youtube"/></svg></a></li>{% endif %}
  {% if site.facebook_url %}<li><a href="{{ site.facebook_url }}" target="_blank" rel="noopener" aria-label="Facebook"><svg class="icon" aria-hidden="true"><use href="#i-facebook"/></svg></a></li>{% endif %}
  {% if site.instagram_url %}<li><a href="{{ site.instagram_url }}" target="_blank" rel="noopener" aria-label="Instagram"><svg class="icon" aria-hidden="true"><use href="#i-instagram"/></svg></a></li>{% endif %}
  {% if site.whatsapp_link %}<li><a href="{{ site.whatsapp_link }}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg></a></li>{% endif %}
</ul>
