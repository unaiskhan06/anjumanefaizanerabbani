<div class="lightbox" data-lightbox-dialog hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" type="button" aria-label="Close" data-lb-close><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <button class="lightbox-arrow lightbox-prev" type="button" aria-label="Previous photo" data-lb-prev><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
  <figure class="lightbox-figure">
    <img class="lightbox-img" src="" alt="" data-lb-img>
    <figcaption class="lightbox-caption" data-lb-caption></figcaption>
  </figure>
  <button class="lightbox-arrow lightbox-next" type="button" aria-label="Next photo" data-lb-next><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
  <p class="lightbox-count" data-lb-count aria-live="polite"></p>
</div>
